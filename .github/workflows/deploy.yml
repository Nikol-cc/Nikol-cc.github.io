name: Deploy Nikol's Lab to GitHub Pages

on:
  push:
    branches: [nikols-lab-migration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  HUSKY: '0'
  DEPLOY_TARGET: github
  SITE_URL: https://nikol-cc.github.io

jobs:
  build:
    if: github.ref == 'refs/heads/nikols-lab-migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - name: Build docs
        run: pnpm install --frozen-lockfile && pnpm run build:docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
